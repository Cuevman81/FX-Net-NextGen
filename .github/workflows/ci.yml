name: CI

# Vercel builds straight from master and its deploy webhook has been missed
# before, so this is the only gate between a commit and a blank page: a
# syntax error in app.js or a bad api/*.py import fails the commit status
# here first. Under a minute, no dependencies beyond Node and Python.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax-check every script the page loads
        run: |
          for f in app.js boot.js diagnostics.js; do node --check "$f"; done

      - name: Compile every Vercel function and the dev server
        run: python -m py_compile api/*.py server.py

      - name: Unit tests
        run: node --test tests/*.test.js
